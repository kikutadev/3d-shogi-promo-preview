<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe3" />
  <meta name="robots" content="noindex,nofollow" />
  <title>3D将棋 — Promo Motion Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5efe3;
      color: #211d18;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5efe3;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    main {
      width: min(1180px, 100%);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.58;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0 0 24px;
      max-width: 720px;
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.7;
      opacity: 0.7;
    }

    .stage {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      background: #ddd4c5;
      box-shadow: 0 24px 70px rgba(45, 35, 24, 0.16);
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #ddd4c5;
    }

    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(250, 247, 240, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: #211d18;
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .meta {
      font-size: 12px;
      opacity: 0.55;
    }

    @media (max-width: 640px) {
      body { place-items: start center; }
      .stage { border-radius: 14px; }
      .lead { margin-bottom: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      video { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Temporary motion preview</p>
    <h1>歩が、兵になる。</h1>
    <p class="lead">将棋駒から兵士へ変身し、そのまま槍で突進するプロモーション用モーションの実レンダープレビューです。</p>

    <section class="stage" aria-label="プロモーション動画プレビュー">
      <video id="promo" autoplay muted loop playsinline preload="auto" poster="media/still_01_pawn.png">
        <source src="media/promo_pawn_transform_1080p.webm" type="video/webm" />
        <source src="media/promo_pawn_transform_1080p.mp4" type="video/mp4" />
        お使いのブラウザでは動画を再生できません。
      </video>
      <div class="badge">UNITY REAL RENDER · 3.6 SEC</div>
    </section>

    <div class="actions">
      <button id="toggle" type="button">一時停止</button>
      <span class="meta">1920×1080 / 30fps / autoplay · muted · loop · playsinline</span>
    </div>
  </main>

  <script>
    const video = document.querySelector('#promo');
    const toggle = document.querySelector('#toggle');

    /** 動画の再生状態に合わせて操作ラベルを同期する。 */
    const syncLabel = () => {
      toggle.textContent = video.paused ? '再生' : '一時停止';
    };

    /** ユーザー操作で再生・一時停止を切り替える。 */
    toggle.addEventListener('click', async () => {
      if (video.paused) {
        await video.play();
      } else {
        video.pause();
      }
      syncLabel();
    });

    video.addEventListener('play', syncLabel);
    video.addEventListener('pause', syncLabel);
  </script>
</body>
</html>
